[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Composition root: the Bevy App and its plugins."

[lints]
workspace = true

[dependencies]
avian3d.workspace = true
bevy.workspace = true
leafwing-input-manager.workspace = true
platform.workspace = true
tracing.workspace = true
voxel-core.workspace = true
voxel-gen.workspace = true
voxel-mesh.workspace = true

[features]
# Developer tools: overlay, debug hotkeys and verbose logs. Compiled out of player builds.
dev = []
# Dev tools plus Chrome-trace spans; open the trace in chrome://tracing or Perfetto.
profile = ["dev", "bevy/trace_chrome"]

[lib]
name = "game"
path = "src/lib.rs"

[[bin]]
name = "game"
path = "src/main.rs"
