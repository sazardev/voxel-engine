[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
voxel-core = { path = "crates/voxel-core" }
voxel-gen = { path = "crates/voxel-gen" }
voxel-mesh = { path = "crates/voxel-mesh" }
platform = { path = "crates/platform" }
bevy = "0.20"
avian3d = "0.8"
leafwing-input-manager = "0.22"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
block-mesh = "0.2"
proptest = "1"

[workspace.lints.rust]
# Unsafe lives only in documented modules that opt in with `#![expect(unsafe_code, reason = "...")]` and a SAFETY comment (ADR 0007).
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Errors are values; panics are for programmer errors only.
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# Lints are never silenced in code without a reason; prefer #[expect(lint, reason = "...")].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
exit = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "warn"
str_to_string = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
# Bevy systems take many parameters and complex query types by design.
type_complexity = "allow"
module_name_repetitions = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.web]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
