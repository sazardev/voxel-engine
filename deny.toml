[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"
# ttf-parser is unmaintained and has no replacement; it comes in through Bevy text. Revisit when Bevy drops it.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "MIT-0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Bevy types stay out of the pure crates (ADR 0002); only game, platform and the Bevy plugins may depend on it.
deny = [
  { crate = "bevy", wrappers = [
    "game",
    "platform",
    "avian3d",
    "bevy_transform_interpolation",
    "leafwing-input-manager",
  ] },
  # Dependency direction is a DAG: only the composition root depends on these (ADR 0002).
  { crate = "platform", wrappers = ["game"] },
  { crate = "voxel-gen", wrappers = ["game"] },
  { crate = "voxel-mesh", wrappers = ["game"] },
  # Offline game: no network stacks (ADR 0007).
  { crate = "reqwest" },
  { crate = "hyper" },
  { crate = "ureq" },
  { crate = "tungstenite" },
  { crate = "openssl" },
  { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
