# Same commands as the Commands table in STACK.md. Never bypass with --no-verify.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.rs"
      run: cargo fmt --all --check
    - name: lint
      glob: "*.{rs,toml}"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: spelling
      run: typos {staged_files}
    - name: docs-format
      glob: "*.{md,toml,json}"
      run: dprint check {staged_files}

pre-push:
  jobs:
    - name: test
      run: cargo test --workspace --all-features
    - name: deny
      run: cargo deny check

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -n1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,100}$' || {
          echo "Commit message must follow Conventional Commits: feat(scope): subject"
          exit 1
        }
